


<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skybound Runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div>
          <p class="eyebrow">SIDE-SCROLL ACTION MVP</p>
          <h1>Skybound Runner</h1>
        </div>
        <div class="stats" aria-live="polite">
          <span>ステージ <strong id="stage-count">1</strong></span>
          <span>コイン <strong id="coin-count">0</strong></span>
          <span>残り <strong id="life-count">3</strong></span>
          <span>無敵 <strong id="invincibility-count">--</strong></span>
          <button id="music-button" class="music-button" type="button">♪ BGM ON</button>
        </div>
      </header>

      <section class="game-frame">
        <canvas id="game" aria-label="横スクロールアクションゲーム"></canvas>
        <div id="message" class="message hidden">
          <h2 id="message-title"></h2>
          <p id="message-text"></p>
          <button id="restart-button" type="button">もう一度遊ぶ</button>
        </div>
      </section>

      <footer class="controls">
        <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 移動</span>
        <span><kbd>W</kbd> / <kbd>↑</kbd> / <kbd>Space</kbd> 二段ジャンプ</span>
        <span><kbd>Enter</kbd> 攻撃</span>
        <span>旗にたどり着こう！</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
